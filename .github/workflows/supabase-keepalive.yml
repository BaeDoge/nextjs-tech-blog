name: Keep Supabase project active

on:
  schedule:
    # GitHub Actions cron uses UTC. Run three times daily (00:17, 08:17, 16:17 UTC).
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -eu
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SECRET_KEY repository secret."
            exit 1
          fi
          URL="${SUPABASE_URL%/}/rest/v1/guestbook_messages?select=id&limit=1"
          STATUS="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --max-time 20 \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --header "Accept: application/json" \
            "$URL")"
          case "$STATUS" in
            2*) echo "Supabase REST ping succeeded (HTTP $STATUS)." ;;
            *) echo "Supabase REST ping failed (HTTP $STATUS)." >&2; exit 1 ;;
          esac
